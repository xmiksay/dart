[package]
name = "dartscore"
version = "0.1.0"
edition = "2021"
description = "Automatic steel-tip dart scoring (YOLOv8 detection + deterministic Rust geometry/scoring)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
