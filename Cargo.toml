[package]
name = "dartscore"
version = "0.1.0"
edition = "2021"
description = "Automatic steel-tip dart scoring (YOLOv8 detection + deterministic Rust geometry/scoring)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async + web (Phase 4: web UI / WebSocket)
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
futures-util = "0.3"

# Single-binary SPA serving: embed web/dist at compile time (release), read from
# disk at runtime (debug) so the backend builds without the frontend present.
rust-embed = "8"
mime_guess = "2"

# Persistence (game history): SeaORM + PostgreSQL
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"

# Image handling — core (used by background-subtraction detection, scoring, capture).
image = "0.25"

# Detection (Phase 1: candle YOLOv8). Gated so the web/db builds stay light.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }

# Camera capture (Phase 3). Gated — needs a platform camera (v4l on Linux).
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

[features]
default = []
detection = ["dep:candle-core", "dep:candle-nn"]
capture = ["dep:nokhwa", "detection"]

[profile.release]
lto = true
codegen-units = 1
