services:
  postgres:
    image: postgres:16
    container_name: dartscore-postgres
    environment:
      POSTGRES_USER: dartscore
      POSTGRES_PASSWORD: dartscore
      POSTGRES_DB: dartscore
    ports:
      - "5432:5432"
    volumes:
      - dartscore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartscore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dartscore_pgdata:
